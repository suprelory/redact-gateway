version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18787:18787"  # Proxy port
      - "18788:18788"  # Management API port
    environment:
      - PROXY_PORT=18787
      - MANAGEMENT_PORT=18788
      - MASTER_KEY=${MASTER_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DATA_DIR=/data
      - LOG_LEVEL=info
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:18788/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
